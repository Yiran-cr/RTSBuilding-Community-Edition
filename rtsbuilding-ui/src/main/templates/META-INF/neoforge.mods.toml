# ── uifw - standalone NeoForge mod descriptor ──
# This template is used when uifw is distributed as an independent mod.
# When bundled inside the main RTS Building JAR, this file is excluded and
# the mod is declared by the main mod's neoforge.mods.toml instead.

modLoader="javafml"
loaderVersion="[1,)"
license="LGPL-3.0-only"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="uifw - UI Framework"
authors="\u4E94\u4E16\u6843\u82B1\u4EAD"
credits="JerryLunar, Diffusion, ReConstruction-127, 可怜Bot, 卓清婉, 凌墨问"
displayURL="https://rts.ciallo.ltd/"
description='''
Standalone Minecraft UI framework: SDF rendering, animation/theme system,
and a reusable window & component library. Mod-agnostic - usable by any mod.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"
