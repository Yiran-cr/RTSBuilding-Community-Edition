plugins {
    id 'net.neoforged.moddev'
}

// 内置附加 mod 子项目列表（单一来源：gradle.properties 的 builtin_mods，阶段六 6.1）
def builtinMods = (providers.gradleProperty('builtin_mods').getOrElse('')
        .split(',') as List).findAll { it != null && !it.trim().isEmpty() }.collect { ':' + it.trim() }

base {
    archivesName = providers.gradleProperty('mod_archive_name').getOrElse(mod_id)
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output',
                file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':rtsbuilding-common').sourceSets.main)
            sourceSet(project(':rtsbuilding-api').sourceSets.main)
            sourceSet(project(':rtsbuilding-ui').sourceSets.main)
            // 内置附加 mod 子项目列表来自 gradle.properties 的 builtin_mods（单一来源，见 6.1）
            for (def modProject in builtinMods) {
                sourceSet(project(modProject).sourceSets.main)
            }
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    additionalRuntimeClasspath.extendsFrom localRuntime
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
        }
    }
    test {
        java {
            srcDir 'src/test/java'
        }
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

dependencies {
    compileOnly project(':rtsbuilding-api')
    compileOnly project(':rtsbuilding-common')

    // 前置 UI 模组：仅编译期引用（compileOnly）。运行时类与资源由上方 mods{}
    // sourceSet 合并进主 mod 提供——若用 implementation project(...)，dev 类路径会
    // 同时出现 uifw 的 jar（独立打包时自带 neoforge.mods.toml）与 sourceSet 合并，
    // 导致 FML duplicate_mod（uifw 出现在 [jar, main] 两处）。
    compileOnly project(':rtsbuilding-ui')

    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}"

    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"

    localRuntime "maven.modrinth:pipez:${pipez_version}"

    runtimeOnly fileTree(dir: 'libs', include: '*.jar')

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.0"
    testImplementation "org.mockito:mockito-core:5.12.0"
    testImplementation "org.mockito:mockito-junit-jupiter:5.12.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.0"
    testImplementation "net.neoforged:neoforge:${neo_version}"

    // common/api 仅以 compileOnly 提供给 main；测试运行时需要它们的类
    // （否则 BlueprintFormatTest/RtsCountUtilTest 抛 NoClassDefFoundError）
    testImplementation project(':rtsbuilding-common')
    testImplementation project(':rtsbuilding-api')
}

// ── Pinyin dictionary verification ──

tasks.register('verifyPinyinDictionary') {
    group = 'verification'
    description = 'Verify the bundled pinyin dictionary resource exists before packaging.'

    def dict = file('src/main/resources/assets/rtsbuilding/pinyin/data.txt')
    inputs.file(dict)

    doLast {
        if (!dict.isFile()) {
            throw new GradleException("Missing pinyin dictionary: ${dict}")
        }
        if (dict.length() < 250_000L) {
            throw new GradleException("Pinyin dictionary looks truncated: ${dict.length()} bytes")
        }
    }
}

tasks.named('processResources').configure {
    dependsOn tasks.named('verifyPinyinDictionary')
}

// ── Addon packaging verification (阶段六 6.2) ──
// 内置附加 mod 的「Gradle 子项目 → modId → 主 @Mod 类（相对 class 路径）」映射。
// 新增内置 addon 时需在此登记（与 gradle.properties builtin_mods 及 neoforge.mods.toml 一致）。
def addonManifest = [
    'rtsbuilding-technologized'           : [
        modId  : 'rtsbuilding_technologized',
        entryClass: 'com/rtsbuilding/rtsbuilding/energy/RtsEnergyMod.class'
    ],
    'rtsaddon-ae2'                        : [
        modId  : 'rtsbuilding_addon_ae2',
        entryClass: 'com/rtsbuilding/addon/ae2/RtsAe2Addon.class'
    ],
    'rtsaddon-refinedstorage'             : [
        modId  : 'rtsbuilding_addon_refinedstorage',
        entryClass: 'com/rtsbuilding/addon/refinedstorage/RtsRefinedStorageAddon.class'
    ],
    'rtsaddon-beyonddimensions'           : [
        modId  : 'rtsbuilding_addon_beyonddimensions',
        entryClass: 'com/rtsbuilding/addon/beyonddimensions/RtsBeyondDimensionsAddon.class'
    ],
    'rtsaddon-sophisticatedbackpacks'     : [
        modId  : 'rtsbuilding_addon_sophisticatedbackpacks',
        entryClass: 'com/rtsbuilding/addon/sophisticatedbackpacks/RtsSophisticatedBackpacksAddon.class'
    ]
]

tasks.register('verifyAddonPackaging') {
    group = 'verification'
    description = 'Verify all built-in addons are merged into the main JAR and declared in neoforge.mods.toml.'
    dependsOn tasks.named('jar')

    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    inputs.property('builtin_mods', builtinMods.join(','))

    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def missing = new ArrayList<String>()

        def jarRoot = new java.util.zip.ZipFile(jarFile)
        def entries = jarRoot.entries()
        def entryNames = new HashSet<String>()
        while (entries.hasMoreElements()) {
            entryNames.add(entries.nextElement().name)
        }

        // 1) 每个内置 addon 的 @Mod 入口类已合入
        for (def mp : builtinMods) {
            def key = mp.substring(1) // 去掉 ':' 前缀得到子项目名
            def manifest = addonManifest[key]
            if (manifest == null) {
                missing.add("builtin_mods 中的 ${key} 未在 addonManifest 登记")
                continue
            }
            if (!entryNames.contains(manifest.entryClass)) {
                missing.add("${key}: 入口类 ${manifest.entryClass} 未合入主 JAR")
            }
        }

        // 2) neoforge.mods.toml 声明了每个内置 addon 的 modId
        def tomlEntry = entryNames.find { it.endsWith('neoforge.mods.toml') }
        if (tomlEntry == null) {
            missing.add('主 JAR 缺少 META-INF/neoforge.mods.toml')
        } else {
            def toml = jarRoot.getInputStream(jarRoot.getEntry(tomlEntry)).text
            for (def mp : builtinMods) {
                def key = mp.substring(1)
                def manifest = addonManifest[key]
                if (manifest != null && !toml.contains("modId=\"${manifest.modId}\"")) {
                    missing.add("${key}: modId ${manifest.modId} 未在 neoforge.mods.toml 声明")
                }
            }
        }
        jarRoot.close()

        if (!missing.isEmpty()) {
            throw new GradleException("Addon packaging verification failed:\n  " + missing.join('\n  '))
        }
        logger.lifecycle("verifyAddonPackaging: ${builtinMods.size()} built-in addons verified in ${jarFile.name}")
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyAddonPackaging')
}

// ── Mod metadata generation ──

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_credits            : mod_credits,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// ── Test task ──

tasks.named('test', Test).configure {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}

// ── Publishing ──

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// ── Jar ──

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_archive_name}-${mod_version}.jar"
    from project(':rtsbuilding-common').sourceSets.main.output
    from project(':rtsbuilding-api').sourceSets.main.output
    // 合并 uifw 输出时排除其自身 neoforge.mods.toml（独立发布时使用），
    // 避免与主 JAR 由 generateModMetadata 生成的 mods.toml 冲突。
    from(project(':rtsbuilding-ui').sourceSets.main.output) {
        exclude 'META-INF/neoforge.mods.toml'
    }
    for (def modProject in builtinMods) {
        from project(modProject).sourceSets.main.output
    }
}

