# -- RTS Building: Community Edition - NeoForge mod descriptor --
# This file is a Gradle template; placeholders like ${mod_id} are expanded by
# generateModMetadata (rtsbuilding-main/build.gradle). Built-in addons are
# merged into the main mod JAR and declared here as separate [[mods]].

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
logoFile="logo.png"

# ------------------------------- Main mod -------------------------------

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="JerryLunar, Diffusion, ReConstruction-127, 可怜Bot, 卓清婉, 凌墨问"
displayURL="https://rts.ciallo.ltd/"
description='''
Build, manage storage, and interact with your base from an overhead RTS-style building panel.
'''

# --------------------------- Bundled UI framework ---------------------------

[[mods]]
modId="uifw"
version="${mod_version}"
displayName="uifw - UI Framework"
authors="${mod_authors}"
credits="JerryLunar, Diffusion, ReConstruction-127, 可怜Bot, 卓清婉, 凌墨问"
displayURL="https://rts.ciallo.ltd/"
description='''
Standalone, mod-agnostic Minecraft UI framework: SDF rendering, animation/theme
system, and a reusable window & component library. Bundled dependency of the
main RTS Building mod; also distributable on its own.
'''

# ----------------------- Built-in addon: Planet Rise -----------------------

[[mods]]
modId="rtsbuilding_planetrise"
version="${mod_version}"
displayName="Planet Rise"
authors="${mod_authors}"
credits="JerryLunar, Diffusion, ReConstruction-127, 可怜Bot, 卓清婉, 凌墨问"
displayURL="https://rts.ciallo.ltd/"
description='''
Built-in addon: the energy & power system for RTSbuilding - thermal generators
and the per-player energy grid that powers remote operations.
'''

# ------------------------ Built-in addon: AE2 ------------------------

[[mods]]
modId="rtsbuilding_addon_ae2"
version="${mod_version}"
displayName="RTSbuilding AE2 Addon"
authors="${mod_authors}"
credits="JerryLunar, Diffusion, ReConstruction-127, 可怜Bot, 卓清婉, 凌墨问"
displayURL="https://rts.ciallo.ltd/"
description='''
AE2 storage network integration for the RTS building panel.
'''

# ---------------------- Built-in addon: Refined Storage ----------------------

[[mods]]
modId="rtsbuilding_addon_refinedstorage"
version="${mod_version}"
displayName="RTSbuilding Refined Storage Addon"
authors="${mod_authors}"
credits="JerryLunar, Diffusion, ReConstruction-127, 可怜Bot, 卓清婉, 凌墨问"
displayURL="https://rts.ciallo.ltd/"
description='''
Refined Storage network integration for the RTS building panel.
'''

# --------------------- Built-in addon: Beyond Dimensions ---------------------

[[mods]]
modId="rtsbuilding_addon_beyonddimensions"
version="${mod_version}"
displayName="RTSbuilding Beyond Dimensions Addon"
authors="${mod_authors}"
credits="JerryLunar, Diffusion, ReConstruction-127, 可怜Bot, 卓清婉, 凌墨问"
displayURL="https://rts.ciallo.ltd/"
description='''
Beyond Dimensions network integration for the RTS building panel.
'''

# ------------------- Built-in addon: Sophisticated Backpacks -------------------

[[mods]]
modId="rtsbuilding_addon_sophisticatedbackpacks"
version="${mod_version}"
displayName="RTSbuilding Sophisticated Backpacks Addon"
authors="${mod_authors}"
credits="JerryLunar, Diffusion, ReConstruction-127, 可怜Bot, 卓清婉, 凌墨问"
displayURL="https://rts.ciallo.ltd/"
description='''
Sophisticated Backpacks integration - link backpack inventories to the RTS storage panel.
'''

# --------------------------------- Mixins ---------------------------------

[[mixins]]
config="${mod_id}.mixins.json"

# ------------------------------ Dependencies ------------------------------
# Main mod: requires NeoForge, Minecraft, and the bundled uifw.

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="uifw"
    type="required"
    versionRange="[${mod_version},)"
    ordering="AFTER"
    side="BOTH"

# uifw: requires NeoForge and Minecraft.

[[dependencies.uifw]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.uifw]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Planet Rise: requires NeoForge, Minecraft, and the main mod.

[[dependencies.rtsbuilding_planetrise]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_planetrise]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_planetrise]]
    modId="${mod_id}"
    type="required"
    versionRange="[${mod_version},)"
    ordering="NONE"
    side="BOTH"

# AE2 addon: requires NeoForge, Minecraft, the main mod; AE2 optional.

[[dependencies.rtsbuilding_addon_ae2]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_addon_ae2]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_addon_ae2]]
    modId="${mod_id}"
    type="required"
    versionRange="[${mod_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_addon_ae2]]
    modId="ae2"
    type="optional"
    versionRange="[15,)"
    ordering="NONE"
    side="BOTH"

# Refined Storage addon: requires NeoForge, Minecraft, the main mod; RS optional.

[[dependencies.rtsbuilding_addon_refinedstorage]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_addon_refinedstorage]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_addon_refinedstorage]]
    modId="${mod_id}"
    type="required"
    versionRange="[${mod_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_addon_refinedstorage]]
    modId="refinedstorage"
    type="optional"
    versionRange="[2,)"
    ordering="NONE"
    side="BOTH"

# Beyond Dimensions addon: requires NeoForge, Minecraft, the main mod; BD optional.

[[dependencies.rtsbuilding_addon_beyonddimensions]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_addon_beyonddimensions]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_addon_beyonddimensions]]
    modId="${mod_id}"
    type="required"
    versionRange="[${mod_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_addon_beyonddimensions]]
    modId="beyonddimensions"
    type="optional"
    versionRange="[0.7,)"
    ordering="NONE"
    side="BOTH"

# Sophisticated Backpacks addon: requires NeoForge, Minecraft, the main mod; SB optional.

[[dependencies.rtsbuilding_addon_sophisticatedbackpacks]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_addon_sophisticatedbackpacks]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_addon_sophisticatedbackpacks]]
    modId="${mod_id}"
    type="required"
    versionRange="[${mod_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.rtsbuilding_addon_sophisticatedbackpacks]]
    modId="sophisticatedbackpacks"
    type="optional"
    versionRange="[3,)"
    ordering="NONE"
    side="BOTH"
