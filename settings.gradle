pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "rtsbuilding"

// 独立前置 UI 模组（可被主 mod 及其他 mod 依赖，modId: rtsbuilding_ui）
include "rtsbuilding-ui"

include "rtsbuilding-common"
include "rtsbuilding-api"
// Main mod — project path kept flat to avoid Java module naming issues with ModDevGradle
include "rtsbuilding-main"

// Built-in addon: energy & power system, packaged inside the main mod JAR
include "rtsbuilding-technologized"

// Addon mods
include "rtsaddon-ae2"

include "rtsaddon-refinedstorage"

include "rtsaddon-beyonddimensions"

include "rtsaddon-sophisticatedbackpacks"
